# Publishes @xformado/xpath2 to the public npm registry.
#
# Auth: npm trusted publishing (OIDC) — configured on npmjs.com (package
# Settings → Trusted publishing) pointing at this repository and this workflow
# file. No long-lived secrets required.
#
# npm binds a trusted publisher to a specific workflow *file*, not to the
# repository: a registry write dispatched from any other file is rejected at
# the OIDC exchange. Keep registry writes in this file.
#
# Bootstrap note: a trusted publisher can only be configured for a package
# that already exists on the registry. For the very first publish, set the
# repository secret NPM_TOKEN (granular access token limited to the
# @xformado scope, publish permission) and run this workflow. Once the
# trusted publisher is configured, delete the secret and revoke the token —
# subsequent runs authenticate via OIDC automatically.

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      # The dist-tag is stated here, not derived from the version string, and
      # it is deliberately "latest".
      #
      # `npm publish` sets exactly one dist-tag, and this workflow cannot move
      # a tag afterwards: the OIDC identity it authenticates with is scoped to
      # publishing, so `npm dist-tag add` fails with E401 (measured
      # 2026-08-06). Whatever tag is set here is therefore the only tag the
      # release gets — and it has to be the one `npm install @xformado/xpath2`
      # resolves to.
      #
      # Deriving it from the version suffix (1.0.0-beta.3 → "beta") left
      # "latest" behind on an older version, which is what consumers actually
      # install. This package has no stable line yet: the newest prerelease is
      # the recommended release. Should that ever stop being true — an
      # experimental build published alongside a stable line — change this tag
      # in the same commit that bumps the version, deliberately.
      # Run as a step of its own, deliberately NOT as `prepublishOnly`.
      #
      # The check reads the output of `npm pack --dry-run --json`, because the
      # set of published files is decided by `files` and `.npmignore` and a scan
      # over anything else would be untrue in both directions. A pack cannot be
      # nested inside a publish: npm does not re-enter the same lifecycle, so
      # the list comes back empty. Wired as `prepublishOnly` the check therefore
      # could not measure anything and refused — which is the right answer to an
      # unmeasurable tarball, and the wrong place to ask the question.
      - name: Check what would be published
        run: npm run check:publish-text

      - name: Publish
        run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Reads back from the registry rather than trusting the exit code of the
      # command that made the change — this is what `npm install` actually gets.
      #
      # ⚠️ It WAITS, because the registry is not read-your-writes. npm says so
      # itself at the end of a publish: "Your package is being processed and may
      # take a few minutes to become available." A single read two seconds after
      # the publish reported `+ @scope/name@version` therefore saw the previous
      # version and failed the release — while the release had in fact gone out,
      # with provenance. A check that reports a good release as a failed one is
      # worse than no check: the next person stops believing the red mark.
      #
      # So the only failure left is the one that is true: the version never
      # appears. The wait is bounded and the message says what it saw.
      - name: Verify against the public registry
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          pkg="$(node -p "require('./package.json').name")"
          reg=https://registry.npmjs.org

          for attempt in $(seq 1 30); do
            actual="$(npm view "$pkg" dist-tags.latest --registry "$reg" 2>/dev/null || true)"
            if [ "$actual" = "$version" ]; then
              echo "latest points at $version (after ${attempt} read(s))."
              echo "Dist-tags now:"
              npm dist-tag ls "$pkg" --registry "$reg"
              exit 0
            fi
            echo "read ${attempt}/30: latest is ${actual:-<unreadable>}, waiting for $version"
            sleep 10
          done

          echo "::error::latest never became $version — last read was ${actual:-<unreadable>} after five minutes."
          echo "Dist-tags now:"
          npm dist-tag ls "$pkg" --registry "$reg" || true
          exit 1
